<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>F1 Watch-along Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     PUSAT PENGATURAN — semua yang mau kamu ubah ada di sini.
     Tiap elemen (FLAG, GP NAME, SESSION, DATE) punya setting sendiri-sendiri:
     font, ukuran, warna, dan offset posisi (geser dikit dari posisi normalnya).
     Offset X positif = geser kanan, negatif = geser kiri.
     Offset Y positif = geser bawah, negatif = geser atas.
     ========================================================================= */
  :root{
    /* ---------- FLAG ---------- */
    --flag-size:        100px;
    --flag-offset-x:    540px;
    --flag-offset-y:    1475px;

    /* ---------- GP NAME (contoh: "BAHRAIN GRAND PRIX") ---------- */
    --gp-font:      'Oswald', sans-serif;
    --gp-size:          28px;
    --gp-weight:         600;
    --gp-color:       #F2F1ED;
    --gp-offset-x:       0px;
    --gp-offset-y:       0px;

    /* ---------- ROUND (contoh: "ROUND 3") ---------- */
    --round-font:   'JetBrains Mono', monospace;
    --round-size:       14px;
    --round-weight:      500;
    --round-color:    #A8ACB4;
    --round-offset-x:    0px;
    --round-offset-y:    0px;

    /* ---------- SESSION BADGE (contoh: "QUALIFYING") ---------- */
    --session-font: 'JetBrains Mono', monospace;
    --session-size:     14px;
    --session-weight:   700;
    --session-offset-x:  0px;
    --session-offset-y:  0px;
    --accent-race:    #E10600;   /* warna badge saat RACE */
    --accent-quali:   #F2B705;   /* warna badge saat QUALI / SPRINT QUALI */
    --accent-sprint:  #FF6A00;   /* warna badge saat SPRINT */
    --accent-practice:#5B6672;   /* warna badge saat FP1/FP2/FP3 */

    /* ---------- DATE (contoh: "23 AUG 2026") ---------- */
    --date-font:    'JetBrains Mono', monospace;
    --date-size:        14px;
    --date-weight:       500;
    --date-color:     #A8ACB4;
    --date-offset-x:     0px;
    --date-offset-y:     0px;

    --gap: 16px; /* jarak horizontal antara flag dan blok teks */
  }
  /* ========================================================================= */

  html,body{ margin:0; padding:0; background:transparent; overflow:hidden; }

  #overlay{
    display:flex;
    align-items:center;
    gap: var(--gap);
    width:fit-content;
    padding:10px 18px;
    opacity:0;
    transform: translateY(-10px);
  }
  #overlay.show{ animation: enter .55s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes enter{ to{ opacity:1; transform:translateY(0); } }

  .flag-emoji{
    font-size: var(--flag-size);
    line-height:1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    position:relative; left: var(--flag-offset-x); top: var(--flag-offset-y);
  }
  .flag-img{
    height: var(--flag-size);
    width: calc(var(--flag-size) * 1.5);
    object-fit: cover;
    border-radius:4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
    display:none;
    position:relative; left: var(--flag-offset-x); top: var(--flag-offset-y);
  }

  .info{ display:flex; flex-direction:column; gap:4px; }

  .gp-name{
    font-family: var(--gp-font);
    font-size: var(--gp-size);
    font-weight: var(--gp-weight);
    color: var(--gp-color);
    letter-spacing:.02em;
    text-transform:uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    white-space:nowrap;
    position:relative; left: var(--gp-offset-x); top: var(--gp-offset-y);
  }

  .meta-row{ display:flex; align-items:center; gap:10px; }

  .round{
    font-family: var(--round-font);
    font-size: var(--round-size);
    font-weight: var(--round-weight);
    color: var(--round-color);
    position:relative; left: var(--round-offset-x); top: var(--round-offset-y);
  }

  .session-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 10px; border-radius:3px;
    font-family: var(--session-font);
    font-size: var(--session-size);
    font-weight: var(--session-weight);
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#111;
    position:relative; left: var(--session-offset-x); top: var(--session-offset-y);
  }
  .session-pill.fp    { background: var(--accent-practice); color:#fff; }
  .session-pill.quali { background: var(--accent-quali); }
  .session-pill.sprint{ background: var(--accent-sprint); color:#fff; }
  .session-pill.race  { background: var(--accent-race); color:#fff; }

  .live-dot{
    width:7px; height:7px; border-radius:50%; background:#fff;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

  .date{
    font-family: var(--date-font);
    font-size: var(--date-size);
    font-weight: var(--date-weight);
    color: var(--date-color);
    letter-spacing:.03em;
    position:relative; left: var(--date-offset-x); top: var(--date-offset-y);
  }

  .flash{ animation: flash .6s ease-out; }
  @keyframes flash{
    0%{ text-shadow: 0 0 12px rgba(255,255,255,.9); }
    100%{ text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  }
</style>
</head>
<body>

  <div id="overlay">
    <div class="flag-emoji" id="flagEmoji">🏁</div>
    <img class="flag-img" id="flagImg" alt="flag">
    <div class="info">
      <div class="gp-name" id="gpName">Grand Prix</div>
      <div class="meta-row">
        <span class="round" id="round"></span>
        <span class="session-pill" id="sessionPill"><span class="live-dot" id="liveDot" style="display:none;"></span><span id="sessionLabel">SESSION</span></span>
        <span class="date" id="date"></span>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const manual = {
    flag:    params.get('flag'),
    gp:      params.get('gp'),
    round:   params.get('round'),
    session: params.get('session'),
    date:    params.get('date'),
  };
  const AUTO_REFRESH_MS = 60000; // cek ulang tiap 60 detik

  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function formatDate(iso){
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return `${String(d.getUTCDate()).padStart(2,'0')} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  }

  function classifySession(sessionName){
    const s = (sessionName || '').toLowerCase();
    if(s.includes('sprint') && s.includes('qualif')) return { label: sessionName.toUpperCase(), cls: 'quali' };
    if(s.includes('sprint')) return { label: sessionName.toUpperCase(), cls: 'sprint' };
    if(s.includes('qualif')) return { label: sessionName.toUpperCase(), cls: 'quali' };
    if(s.includes('race'))   return { label: sessionName.toUpperCase(), cls: 'race' };
    return { label: (sessionName || 'SESSION').toUpperCase(), cls: 'fp' };
  }

  let lastSignature = '';

  function render(data){
    const signature = JSON.stringify(data);
    const changed = signature !== lastSignature;
    lastSignature = signature;

    if(data.flagUrl){
      document.getElementById('flagImg').src = data.flagUrl;
      document.getElementById('flagImg').style.display = 'block';
      document.getElementById('flagEmoji').style.display = 'none';
    } else {
      document.getElementById('flagEmoji').textContent = data.flagEmoji || '🏁';
      document.getElementById('flagEmoji').style.display = 'block';
      document.getElementById('flagImg').style.display = 'none';
    }

    document.getElementById('gpName').textContent = data.gpName || 'Grand Prix';
    document.getElementById('round').textContent = data.round ? data.round.toUpperCase() : '';
    document.getElementById('date').textContent = formatDate(data.dateIso);

    const sess = classifySession(data.sessionName);
    const pill = document.getElementById('sessionPill');
    pill.className = 'session-pill ' + sess.cls;
    document.getElementById('sessionLabel').textContent = sess.label;
    document.getElementById('liveDot').style.display = sess.cls === 'race' ? 'inline-block' : 'none';

    const overlay = document.getElementById('overlay');
    if(!overlay.classList.contains('show')){
      requestAnimationFrame(() => overlay.classList.add('show'));
    } else if(changed){
      document.getElementById('gpName').classList.remove('flash');
      void document.getElementById('gpName').offsetWidth;
      document.getElementById('gpName').classList.add('flash');
    }
  }

  function renderDefault(){
    render({
      flagEmoji: manual.flag || '🏁',
      gpName: manual.gp || 'Menunggu jadwal...',
      round: manual.round || '',
      sessionName: manual.session || 'STANDBY',
      dateIso: manual.date || new Date().toISOString(),
    });
  }

  // ---- Cari sesi yang paling relevan: yang lagi berlangsung sekarang,
  //      atau kalau nggak ada, sesi TERDEKAT berikutnya di masa depan.
  //      Kalau musim udah selesai semua, fallback ke sesi terakhir yang udah lewat. ----
  function pickRelevantSession(sessions, now){
    const live = sessions.find(s => new Date(s.date_start) <= now && now <= new Date(s.date_end));
    if(live) return { session: live, isLive: true };

    const upcoming = sessions
      .filter(s => new Date(s.date_start) > now)
      .sort((a,b) => new Date(a.date_start) - new Date(b.date_start));
    if(upcoming.length) return { session: upcoming[0], isLive: false };

    const past = sessions
      .filter(s => new Date(s.date_end) < now)
      .sort((a,b) => new Date(b.date_start) - new Date(a.date_start));
    if(past.length) return { session: past[0], isLive: false };

    return null;
  }

  async function fetchAndRender(){
    if(manual.gp && manual.session && manual.date){
      render({
        flagEmoji: manual.flag || '🏁',
        gpName: manual.gp,
        round: manual.round || '',
        sessionName: manual.session,
        dateIso: manual.date,
      });
      return;
    }

    try{
      const now = new Date();
      const year = now.getUTCFullYear();
      // Ambil tahun ini + tahun depan, biar pas jeda akhir musim tetap nangkep GP pertama musim berikutnya.
      const [sessionsA, sessionsB, meetingsA, meetingsB] = await Promise.all([
        fetch(`https://api.openf1.org/v1/sessions?year=${year}`).then(r => r.json()),
        fetch(`https://api.openf1.org/v1/sessions?year=${year + 1}`).then(r => r.json()).catch(() => []),
        fetch(`https://api.openf1.org/v1/meetings?year=${year}`).then(r => r.json()),
        fetch(`https://api.openf1.org/v1/meetings?year=${year + 1}`).then(r => r.json()).catch(() => []),
      ]);

      const allSessions = [...sessionsA, ...sessionsB];
      const allMeetings = [...meetingsA, ...meetingsB];
      const meetingByKey = Object.fromEntries(allMeetings.map(m => [m.meeting_key, m]));

      const picked = pickRelevantSession(allSessions, now);
      if(!picked) throw new Error('Nggak ada data sesi ditemukan');

      const { session } = picked;
      const meeting = meetingByKey[session.meeting_key];

      render({
        flagUrl: meeting ? meeting.country_flag : undefined,
        gpName: manual.gp || (meeting ? meeting.meeting_name : session.location),
        round: manual.round || '',
        sessionName: manual.session || session.session_name,
        dateIso: manual.date || session.date_start,
      });
    }catch(err){
      console.error('Gagal fetch OpenF1:', err);
      renderDefault();
    }
  }

  fetchAndRender();
  setInterval(fetchAndRender, AUTO_REFRESH_MS);
</script>

</body>
</html>
