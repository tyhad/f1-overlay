<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>F1 Watch-along Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* UBAH JARAK DAN POSISI UTAMA DI SINI */
    --padding-top: 40px;
    --gap-elements: 25px; /* Jarak vertikal antar-objek */

    /* UKURAN ELEMEN */
    --flag-size: 100px;
    
    --gp-font: 'Manrope', sans-serif;
    --gp-size: 52px;
    --gp-color: #FFFFFF;

    --session-font: 'Manrope', sans-serif;
    --session-size: 44px;

    --date-font: 'Quicksand', sans-serif;
    --date-size: 28px;
    --date-color: #FFFFFF;

    /* WARNA STATUS SESI */
    --accent-race:     #E10600;
    --accent-quali:    #F2B705;
    --accent-sprint:   #FF6A00;
    --accent-practice: #A8ACB4;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* KOTAK CONTAINER UTAMA (ALIGNED TO CENTER) */
  #overlay {
    position: absolute;
    top: var(--padding-top);
    left: 50%;
    transform: translateX(-50%); /* Membuat posisi horizontal persis di tengah layar */
    display: flex;
    flex-direction: column;
    align-items: center; /* Posisikan semua anak elemen di tengah */
    justify-content: center;
    gap: var(--gap-elements);
    text-align: center; /* Teks rata tengah */
    opacity: 0;
    width: 100%;
  }

  #overlay.show {
    animation: enter .55s cubic-bezier(.2, .8, .2, 1) forwards;
  }

  @keyframes enter {
    to { opacity: 1; }
  }

  /* FLAG ELEMEN */
  .flag-emoji {
    font-size: var(--flag-size);
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }

  .flag-img {
    height: var(--flag-size);
    width: auto;
    object-fit: contain;
    border-radius: 4px;
    display: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }

  /* GP NAME ELEMEN */
  .gp-name {
    font-family: var(--gp-font);
    font-size: var(--gp-size);
    font-weight: 800;
    color: var(--gp-color);
    letter-spacing: -0.01em;
    text-shadow: 0 3px 8px rgba(0,0,0,0.8);
    line-height: 1;
    margin: 0;
    text-transform: capitalize;
  }

  /* SESSION ELEMEN */
  .session-text {
    font-family: var(--session-font);
    font-size: var(--session-size);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
    text-shadow: 0 3px 8px rgba(0,0,0,0.8);
    margin: 0;
    text-transform: capitalize;
  }

  .session-text.fp     { color: var(--accent-practice); }
  .session-text.quali  { color: var(--accent-quali); }
  .session-text.sprint { color: var(--accent-sprint); }
  .session-text.race   { color: var(--accent-race); }

  /* DATE ELEMEN */
  .date {
    font-family: var(--date-font);
    font-size: var(--date-size);
    font-weight: 600;
    color: var(--date-color);
    line-height: 1;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    margin: 0;
  }

  .flash { animation: flash .6s ease-out; }
  @keyframes flash {
    0% { text-shadow: 0 0 20px rgba(255,255,255,.9); }
    100% { text-shadow: 0 3px 8px rgba(0,0,0,0.8); }
  }
</style>
</head>
<body>

  <div id="overlay">
    <div class="flag-emoji" id="flagEmoji">🏁</div>
    <img class="flag-img" id="flagImg" alt="flag">
    <div class="gp-name" id="gpName">Grand Prix</div>
    <div class="session-text" id="sessionText">SESSION</div>
    <div class="date" id="date"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const manual = {
    flag:    params.get('flag'),
    gp:      params.get('gp'),
    round:   params.get('round'),
    session: params.get('session'),
    date:    params.get('date'),
  };
  const AUTO_REFRESH_MS = 60000;

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    // Format tanggal: 23 Aug 2026
    return `${String(d.getUTCDate()).padStart(2,'0')} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  }

  // Fungsi sakti buat bikin Title Case (Awal Kata Besar, Sisanya Kecil)
  function toTitleCase(str) {
    if (!str) return '';
    return str.toLowerCase().split(' ').map(word => {
      return word.charAt(0).toUpperCase() + word.slice(1);
    }).join(' ');
  }

  function classifySession(sessionName){
    const s = (sessionName || '').toLowerCase();
    const label = sessionName || 'Race Week';
    
    if(s.includes('sprint') && s.includes('qualif')) return { label: label, cls: 'quali' };
    if(s.includes('sprint')) return { label: label, cls: 'sprint' };
    if(s.includes('qualif')) return { label: label, cls: 'quali' };
    if(s.includes('race'))   return { label: label, cls: 'race' };
    return { label: label, cls: 'fp' };
  }

  let lastSignature = '';

  function render(data){
    const signature = JSON.stringify(data);
    const changed = signature !== lastSignature;
    lastSignature = signature;

    if(data.flagUrl){
      document.getElementById('flagImg').src = data.flagUrl;
      document.getElementById('flagImg').style.display = 'block';
      document.getElementById('flagEmoji').style.display = 'none';
    } else {
      document.getElementById('flagEmoji').textContent = data.flagEmoji || '🏁';
      document.getElementById('flagEmoji').style.display = 'block';
      document.getElementById('flagImg').style.display = 'none';
    }

    // Terapkan Title Case di sini
    document.getElementById('gpName').textContent = toTitleCase(data.gpName || 'F1 Grand Prix');
    document.getElementById('date').textContent = formatDate(data.dateIso);

    const sess = classifySession(data.sessionName);
    const sessionEl = document.getElementById('sessionText');
    sessionEl.className = 'session-text ' + sess.cls;
    
    // Terapkan Title Case untuk nama Session juga
    sessionEl.textContent = toTitleCase(sess.label);

    const overlay = document.getElementById('overlay');
    if(!overlay.classList.contains('show')){
      requestAnimationFrame(() => overlay.classList.add('show'));
    } else if(changed){
      document.getElementById('gpName').classList.remove('flash');
      void document.getElementById('gpName').offsetWidth;
      document.getElementById('gpName').classList.add('flash');
    }
  }

  function renderDefault(){
    render({
      flagEmoji: manual.flag || '🏎️',
      gpName: manual.gp || 'Menunggu Jadwal',
      sessionName: manual.session || 'Standby',
      dateIso: manual.date || new Date().toISOString(),
    });
  }

  async function safeFetch(url) {
    try {
      const res = await fetch(url);
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  async function fetchAndRender(){
    if(manual.gp && manual.session && manual.date){
      render({
        flagEmoji: manual.flag || '🏁',
        gpName: manual.gp,
        sessionName: manual.session,
        dateIso: manual.date,
      });
      return;
    }

    try{
      const now = new Date();
      const year = now.getUTCFullYear();
      
      const [sessionsA, sessionsB, meetingsA, meetingsB] = await Promise.all([
        safeFetch(`https://api.openf1.org/v1/sessions?year=${year}`),
        safeFetch(`https://api.openf1.org/v1/sessions?year=${year + 1}`),
        safeFetch(`https://api.openf1.org/v1/meetings?year=${year}`),
        safeFetch(`https://api.openf1.org/v1/meetings?year=${year + 1}`)
      ]);

      const allSessions = [...sessionsA, ...sessionsB];
      const allMeetings = [...meetingsA, ...meetingsB];
      
      if(allMeetings.length === 0) throw new Error('API melimit request / Tidak ada data meeting');

      const liveSess = allSessions.find(s => new Date(s.date_start) <= now && now <= new Date(s.date_end));
      const upcomingSess = allSessions.filter(s => new Date(s.date_start) > now).sort((a,b) => new Date(a.date_start) - new Date(b.date_start));
      const pastSess = allSessions.filter(s => new Date(s.date_end) < now).sort((a,b) => new Date(b.date_start) - new Date(a.date_start));
      
      let pickedSession = liveSess || upcomingSess[0] || pastSess[0];

      if (!pickedSession) {
        const upcomingMeeting = allMeetings.filter(m => new Date(m.date_start) > now).sort((a,b) => new Date(a.date_start) - new Date(b.date_start));
        const pastMeeting = allMeetings.filter(m => new Date(m.date_start) < now).sort((a,b) => new Date(b.date_start) - new Date(a.date_start));
        
        const fallbackMeeting = upcomingMeeting[0] || pastMeeting[0];
        
        if (fallbackMeeting) {
          render({
            flagUrl: fallbackMeeting.country_flag,
            gpName: manual.gp || fallbackMeeting.meeting_name,
            sessionName: manual.session || 'Race Week',
            dateIso: manual.date || fallbackMeeting.date_start,
          });
          return;
        }
      }

      if (pickedSession) {
        const meetingByKey = Object.fromEntries(allMeetings.map(m => [m.meeting_key, m]));
        const meeting = meetingByKey[pickedSession.meeting_key];

        render({
          flagUrl: meeting ? meeting.country_flag : undefined,
          gpName: manual.gp || (meeting ? meeting.meeting_name : pickedSession.location),
          sessionName: manual.session || pickedSession.session_name,
          dateIso: manual.date || pickedSession.date_start,
        });
      } else {
        throw new Error('Tetap tidak ada jadwal yang sesuai');
      }

    }catch(err){
      console.error('Gagal fetch OpenF1:', err);
      renderDefault();
    }
  }

  fetchAndRender();
  setInterval(fetchAndRender, AUTO_REFRESH_MS);
</script>

</body>
</html>
