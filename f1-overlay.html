<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>F1 Watch-along Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Quicksand:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    /* POSISI SELURUH OVERLAY (Sesuaikan X dan Y kotak utamanya di sini) */
    --overlay-x: 100px;
    --overlay-y: 100px;

    /* UKURAN FONT & ELEMEN */
    --flag-size: 80px;
    
    --gp-font: 'Manrope', sans-serif;
    --gp-size: 56px;
    --gp-color: #F2F1ED;

    --session-font: 'Manrope', sans-serif;
    --session-size: 48px;

    --date-font: 'Quicksand', sans-serif;
    --date-size: 32px;
    --date-color: #A8ACB4;

    /* WARNA TEMA SESSION */
    --accent-race:     #E10600;
    --accent-quali:    #F2B705;
    --accent-sprint:   #FF6A00;
    --accent-practice: #A8ACB4;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* KOTAK UTAMA PENAMPUNG */
  #overlay {
    position: absolute;
    left: var(--overlay-x);
    top: var(--overlay-y);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px; /* Jarak teratur antarelemen */
    opacity: 0;
  }

  #overlay.show {
    animation: enter .55s cubic-bezier(.2, .8, .2, 1) forwards;
  }

  @keyframes enter {
    to { opacity: 1; }
  }

  /* FLAG ELEMEN */
  .flag-emoji {
    font-size: var(--flag-size);
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }

  .flag-img {
    height: var(--flag-size);
    width: auto;
    object-fit: contain;
    display: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }

  /* GP NAME ELEMEN */
  .gp-name {
    font-family: var(--gp-font);
    font-size: var(--gp-size);
    font-weight: 800;
    color: var(--gp-color);
    letter-spacing: -0.02em;
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    line-height: 1;
    margin: 0;
  }

  /* SESSION ELEMEN */
  .session-text {
    font-family: var(--session-font);
    font-size: var(--session-size);
    font-weight: 800;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    margin: 0;
  }

  .session-text.fp     { color: var(--accent-practice); }
  .session-text.quali  { color: var(--accent-quali); }
  .session-text.sprint { color: var(--accent-sprint); }
  .session-text.race   { color: var(--accent-race); }

  /* DATE ELEMEN */
  .date {
    font-family: var(--date-font);
    font-size: var(--date-size);
    font-weight: 400;
    color: var(--date-color);
    line-height: 1;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
    margin: 0;
  }

  .flash { animation: flash .6s ease-out; }
  @keyframes flash {
    0% { text-shadow: 0 0 20px rgba(255,255,255,.9); }
    100% { text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  }
</style>
</head>
<body>

  <div id="overlay">
    <div class="flag-emoji" id="flagEmoji">🏁</div>
    <img class="flag-img" id="flagImg" alt="flag">
    <div class="gp-name" id="gpName">Grand Prix</div>
    <div class="session-text" id="sessionText">SESSION</div>
    <div class="date" id="date"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const manual = {
    flag:    params.get('flag'),
    gp:      params.get('gp'),
    round:   params.get('round'),
    session: params.get('session'),
    date:    params.get('date'),
  };
  const AUTO_REFRESH_MS = 60000;

  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function formatDate(iso){
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return `${String(d.getUTCDate()).padStart(2,'0')} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  }

  function classifySession(sessionName){
    const s = (sessionName || '').toLowerCase();
    if(s.includes('sprint') && s.includes('qualif')) return { label: sessionName.toUpperCase(), cls: 'quali' };
    if(s.includes('sprint')) return { label: sessionName.toUpperCase(), cls: 'sprint' };
    if(s.includes('qualif')) return { label: sessionName.toUpperCase(), cls: 'quali' };
    if(s.includes('race'))   return { label: sessionName.toUpperCase(), cls: 'race' };
    return { label: (sessionName || 'SESSION').toUpperCase(), cls: 'fp' };
  }

  let lastSignature = '';

  function render(data){
    const signature = JSON.stringify(data);
    const changed = signature !== lastSignature;
    lastSignature = signature;

    if(data.flagUrl){
      document.getElementById('flagImg').src = data.flagUrl;
      document.getElementById('flagImg').style.display = 'block';
      document.getElementById('flagEmoji').style.display = 'none';
    } else {
      document.getElementById('flagEmoji').textContent = data.flagEmoji || '🏁';
      document.getElementById('flagEmoji').style.display = 'block';
      document.getElementById('flagImg').style.display = 'none';
    }

    document.getElementById('gpName').textContent = data.gpName || 'Grand Prix';
    document.getElementById('date').textContent = formatDate(data.dateIso);

    const sess = classifySession(data.sessionName);
    const sessionEl = document.getElementById('sessionText');
    sessionEl.className = 'session-text ' + sess.cls;
    sessionEl.textContent = sess.label;

    const overlay = document.getElementById('overlay');
    if(!overlay.classList.contains('show')){
      requestAnimationFrame(() => overlay.classList.add('show'));
    } else if(changed){
      document.getElementById('gpName').classList.remove('flash');
      void document.getElementById('gpName').offsetWidth;
      document.getElementById('gpName').classList.add('flash');
    }
  }

  function renderDefault(){
    render({
      flagEmoji: manual.flag || '🏁',
      gpName: manual.gp || 'Menunggu jadwal...',
      sessionName: manual.session || 'STANDBY',
      dateIso: manual.date || new Date().toISOString(),
    });
  }

  function pickRelevantSession(sessions, now){
    const live = sessions.find(s => new Date(s.date_start) <= now && now <= new Date(s.date_end));
    if(live) return { session: live, isLive: true };

    const upcoming = sessions
      .filter(s => new Date(s.date_start) > now)
      .sort((a,b) => new Date(a.date_start) - new Date(b.date_start));
    if(upcoming.length) return { session: upcoming[0], isLive: false };

    const past = sessions
      .filter(s => new Date(s.date_end) < now)
      .sort((a,b) => new Date(b.date_start) - new Date(a.date_start));
    if(past.length) return { session: past[0], isLive: false };

    return null;
  }

  async function fetchAndRender(){
    if(manual.gp && manual.session && manual.date){
      render({
        flagEmoji: manual.flag || '🏁',
        gpName: manual.gp,
        sessionName: manual.session,
        dateIso: manual.date,
      });
      return;
    }

    try{
      const now = new Date();
      const year = now.getUTCFullYear();
      const [sessionsA, sessionsB, meetingsA, meetingsB] = await Promise.all([
        fetch(`https://api.openf1.org/v1/sessions?year=${year}`).then(r => r.json()),
        fetch(`https://api.openf1.org/v1/sessions?year=${year + 1}`).then(r => r.json()).catch(() => []),
        fetch(`https://api.openf1.org/v1/meetings?year=${year}`).then(r => r.json()),
        fetch(`https://api.openf1.org/v1/meetings?year=${year + 1}`).then(r => r.json()).catch(() => []),
      ]);

      const allSessions = [...sessionsA, ...sessionsB];
      const allMeetings = [...meetingsA, ...meetingsB];
      const meetingByKey = Object.fromEntries(allMeetings.map(m => [m.meeting_key, m]));

      const picked = pickRelevantSession(allSessions, now);
      if(!picked) throw new Error('Nggak ada data sesi ditemukan');

      const { session } = picked;
      const meeting = meetingByKey[session.meeting_key];

      render({
        flagUrl: meeting ? meeting.country_flag : undefined,
        gpName: manual.gp || (meeting ? meeting.meeting_name : session.location),
        sessionName: manual.session || session.session_name,
        dateIso: manual.date || session.date_start,
      });
    }catch(err){
      console.error('Gagal fetch OpenF1:', err);
      renderDefault();
    }
  }

  fetchAndRender();
  setInterval(fetchAndRender, AUTO_REFRESH_MS);
</script>

</body>
</html>
